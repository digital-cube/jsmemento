[package]
name = "memento"
version = "0.1.0"
edition = "2021"
description = "JSMemento sample client: push an event, query the last ten, tail the stream for 10 s"
publish = false

[dependencies]
serde_json = "1"
tungstenite = { version = "0.30", features = ["native-tls"] }
ureq = { version = "3", features = ["json"] }

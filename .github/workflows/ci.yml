# Pull requests (and every push to main): lint, type check, unit tests with coverage, E2E —
# then the Docker image is built and the E2E suite runs again against docker-compose.yaml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jsmemento
          POSTGRES_PASSWORD: jsmemento
          POSTGRES_DB: jsmemento_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jsmemento -d jsmemento_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://jsmemento:jsmemento@localhost:5432/jsmemento_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests + coverage (≥ 80 % per package)
        run: pnpm test:coverage
      - name: E2E (built server ×2, PostgreSQL, Redis)
        run: pnpm test:e2e
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "| package | lines | statements | functions | branches |"
            echo "|---|---|---|---|---|"
            for f in packages/*/coverage/coverage-summary.json; do
              [ -f "$f" ] || continue
              node -e '
                const t = require(process.argv[1]).total;
                const p = process.argv[1].split("/")[1];
                console.log(`| @memento/${p} | ${t.lines.pct} % | ${t.statements.pct} % | ${t.functions.pct} % | ${t.branches.pct} % |`);
              ' "$PWD/$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore

  docker:
    name: Docker image + E2E against docker-compose.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEMENTO_IMAGE: jsmemento:ci
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jsmemento:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        run: docker compose -f docker-compose.yaml up -d --wait --no-build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: E2E against the container
        env:
          MEMENTO_E2E_URL: http://localhost:3000/memento
          MEMENTO_E2E_DATABASE_URL: postgresql://jsmemento:jsmemento@localhost:5432/jsmemento
        run: pnpm test:e2e
      - name: Bundled CLI works
        run: docker compose -f docker-compose.yaml exec -T memento memento list-tenants
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yaml logs
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yaml down -v

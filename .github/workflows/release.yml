# Publishing.
# - merge to main  → ghcr.io/digital-cube/jsmemento:main, :edge, :sha-<short>
# - tag vX.Y.Z     → ghcr.io/digital-cube/jsmemento:X.Y.Z, :X.Y, :X, :latest,
#                    a GitHub release (notes from CHANGELOG.md) and the @jsmemento/* npm packages.
# The tag must equal the version in package.json (bump every package, then `git tag vX.Y.Z`).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Package versions agree (and match the tag)
        run: |
          version=$(node -p 'require("./package.json").version')
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$version" ] || { echo "::error file=$f::version $v ≠ root $version"; exit 1; }
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  image:
    name: Docker image → ghcr.io
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && needs.version.outputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n**Docker:** `docker pull %s:%s`\n' "$IMAGE" "$VERSION" >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # npm through Trusted Publishing (https://docs.npmjs.com/trusted-publishers): each of the five
  # public packages has a trusted publisher on npmjs.com for digital-cube/jsmemento, workflow
  # `release.yml`, no environment. pnpm (11.21, from `packageManager`) exchanges this job's OIDC
  # token for a short-lived publish token per package — no stored secret — and the provenance
  # statement is signed with the same identity. Re-runnable: `pnpm -r publish` skips every
  # package whose version is already on the registry, and the last step checks the registry.
  npm:
    name: Publish @jsmemento/* to npm
    if: github.ref_type == 'tag'
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # npm's advice: no dependency cache in a release build
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      # NPM_TOKEN is only a FALLBACK until the first release through OIDC has succeeded: pnpm tries
      # OIDC first and uses the token only when the exchange fails ("Skipped OIDC: …", turned into
      # a warning below). npm revokes the token in January 2027; after a release published through
      # OIDC, delete the NPM_TOKEN secret and this env line.
      - name: Publish (trusted publishing, NPM_TOKEN as fallback)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          pnpm -r --filter "./packages/*" publish --access public --provenance --no-git-checks 2>&1 \
            | tee "$RUNNER_TEMP/publish.log"
          if grep -q "Skipped OIDC" "$RUNNER_TEMP/publish.log"; then
            echo "::warning::Trusted publishing did not work for at least one package (see 'Skipped OIDC' above) — it was published with NPM_TOKEN, or not at all. Check the package's trusted publisher on npmjs.com: digital-cube / jsmemento / release.yml, no environment, 'Allow npm publish'."
          fi
      # A green publish is not proof: 1.1.0's job was green while npm had only staged the packages.
      - name: Every public package is installable at this version
        if: ${{ !cancelled() }} # also after a failed publish: says which packages made it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          missing=0
          for manifest in packages/*/package.json; do
            name=$(node -p "const p = require('./$manifest'); p.private ? '' : p.name")
            [ -n "$name" ] || continue
            got=""
            for _ in 1 2 3 4 5 6; do
              got=$(npm view "$name@$VERSION" version --prefer-online 2>/dev/null || true)
              [ "$got" = "$VERSION" ] && break
              sleep 10
            done
            if [ "$got" != "$VERSION" ]; then
              echo "::error::$name@$VERSION is not on npm. If npmjs.com lists it under Staged packages, approve it there (2FA) and re-run this job; otherwise read the Publish step above."
              missing=1
            elif [ -n "$(npm view "$name@$VERSION" dist.attestations.url 2>/dev/null)" ]; then
              echo "$name@$VERSION is on npm, with provenance"
            else
              echo "::warning::$name@$VERSION is on npm without a provenance statement"
            fi
          done
          exit "$missing"

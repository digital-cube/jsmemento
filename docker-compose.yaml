# Production-like JSMemento stack: the memento server + PostgreSQL + Redis.
#   docker compose -f docker-compose.yaml up -d --build
#   docker compose -f docker-compose.yaml exec memento memento create-tenant acme --name "Acme"
#   docker compose -f docker-compose.yaml exec memento memento create-key --tenant acme --scopes read,write
# (compose.yaml next to it is the development infrastructure: PostgreSQL + Redis only.)
# Every ${VAR} can be set in the shell or in a .env file next to this file; see docs/DEPLOYMENT.md.
name: jsmemento

services:
  memento:
    image: ${MEMENTO_IMAGE:-ghcr.io/digital-cube/jsmemento:latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jsmemento}:${POSTGRES_PASSWORD:-jsmemento}@postgres:5432/${POSTGRES_DB:-jsmemento}
      REDIS_URL: redis://redis:6379/0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEMENTO_DEFAULT_LOCALE: ${MEMENTO_DEFAULT_LOCALE:-en}
      MEMENTO_LOOKUPS_STRICT: ${MEMENTO_LOOKUPS_STRICT:-false}
      # A read-only key GET /memento/api/demo hands to the examples site, so it connects
      # without a pasted key (memento create-key --tenant demo --scopes read). Empty: no demo
      # key, the route answers 404. A key that is not read-only stops the server at startup.
      MEMENTO_DEMO_API_KEY: ${DEMO_API_KEY:-}
    ports:
      - "${MEMENTO_PORT:-3000}:3000"
    volumes:
      # lookup candidates recorded for review (MEMENTO_CANDIDATES_DIR=/data/candidates)
      - memento-data:/data
    healthcheck:
      test: ["CMD", "memento-healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Demo data: pushes the host's load averages as CPU_LOAD events every second, so the
  # CPU monitor of the examples site (/ and /en/) always shows a live table. Off unless the `demo` profile is on
  # (`--profile demo` or COMPOSE_PROFILES=demo); see docs/DEPLOYMENT.md "Demo pusher".
  # Same image as `memento`, no `build:` — the image is built once, by `memento`.
  cpu-monitor:
    image: ${MEMENTO_IMAGE:-ghcr.io/digital-cube/jsmemento:latest}
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      memento:
        condition: service_healthy
    command:
      - memento
      - cpu-monitor
      - --interval
      - "${CPU_MONITOR_INTERVAL:-1}"
      - --tenant
      - "${CPU_MONITOR_TENANT:-demo}"
      - --instance-id
      - "${CPU_MONITOR_INSTANCE_ID:-stage}"
    environment:
      MEMENTO_URL: http://memento:3000/memento
      # A key with the write scope, from .env. Not `:?` — compose interpolates every service,
      # profile or not, so that would break the stack without `demo`. Without a key the CLI
      # exits with "no API key" and `docker compose logs cpu-monitor` says so.
      MEMENTO_API_KEY: ${CPU_MONITOR_API_KEY:-}

  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jsmemento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jsmemento}
      POSTGRES_DB: ${POSTGRES_DB:-jsmemento}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memento-data:
  postgres-data:
  redis-data:

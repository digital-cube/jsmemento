# =====================================================================
# service.memento-service.org: JSMemento, PRODUCTION, on digitalcube-production-websites.
#
# TLS is terminated UPSTREAM (the edge h2, LE lineage service.memento-service.org, Host forwarded
# unchanged), so this vhost listens on :80 and proxies to
# the service site (apps/service: register, keys, usage, /clients), accounts on:
# the systemd user unit memento-service-prod.service on 127.0.0.1:8201
# (not a container: nothing on this VM is).
# Stage sibling: memento-service-stage (service.stage.memento-service.org, compose on
# the stage VM), the same proxy.
#
# Installed by `deploy/examples/prod.sh --install`, two steps as every site on this VM:
#   /etc/nginx/sites-available/service.memento-service.org -> /home/digital/sites/examples.memento-service.org/ops/deploy/examples/nginx/service.memento-service.org.conf
#   /etc/nginx/sites-enabled/service.memento-service.org   -> /etc/nginx/sites-available/service.memento-service.org
# The hand-written "coming soon" vhost that was there is kept as
# sites-available/service.memento-service.org.coming-soon. A deploy that changes this file
# reloads nginx (after nginx -t).
# =====================================================================

upstream memento_service_prod_backend {
    server 127.0.0.1:8201;
}

server {
    listen 80;
    listen [::]:80;

    server_name service.memento-service.org;

    access_log /var/log/nginx/service.memento-service.org.access.log;
    error_log  /var/log/nginx/service.memento-service.org.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # POST /memento/events takes JSON events; batches stay well below this
    client_max_body_size 5m;

    location / {
        proxy_pass http://memento_service_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS ends on the edge: the server must see https (the session cookie is Secure)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSocket: the live stream /memento/ws (heartbeat 30 s)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

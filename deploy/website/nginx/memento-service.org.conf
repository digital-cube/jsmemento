# =====================================================================
# memento-service.org — the memento website (apps/website, Astro +
# Starlight), production; www.memento-service.org is a 301 to it.
#
# VM digitalcube-production-websites. TLS is terminated UPSTREAM (the
# edge, which forwards the Host header unchanged), so this vhost listens
# on :80 only.
#
# Static files only: deploy/website/prod.sh builds the site (a release
# tag) into
#   /home/digital/sites/memento-service.org/releases/<short sha>/
# and atomically repoints the `current` symlink this root follows.
# /_astro/* is content-hashed and cached for a year; everything else
# (HTML, pagefind's index, the sitemap) is revalidated on every request.
# A path that does not exist is a real 404 with the site's 404 page.
#
# Install (deploy/website/prod.sh --install does this, from ops/, the
# checkout of main it keeps beside the release it builds):
#   sudo ln -sfn /home/digital/sites/memento-service.org/ops/deploy/website/nginx/memento-service.org.conf \
#       /etc/nginx/sites-available/memento-service.org
#   sudo ln -sfn /etc/nginx/sites-available/memento-service.org /etc/nginx/sites-enabled/memento-service.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/website/prod.sh
# =====================================================================

# www. -> the apex, path and query kept. https: the edge speaks it.
server {
    listen 80;
    listen [::]:80;

    server_name www.memento-service.org;

    access_log /var/log/nginx/memento-service.org.access.log;
    error_log  /var/log/nginx/memento-service.org.error.log;

    return 301 https://memento-service.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name memento-service.org;

    access_log /var/log/nginx/memento-service.org.access.log;
    error_log  /var/log/nginx/memento-service.org.error.log;

    root  /home/digital/sites/memento-service.org/current;
    index index.html;

    # /get-started -> /get-started/ as a relative Location: the edge speaks
    # https, this vhost does not know it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed by Astro: a changed file gets a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}

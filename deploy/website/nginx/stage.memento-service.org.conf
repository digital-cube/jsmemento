# =====================================================================
# stage.memento-service.org — the memento website (apps/website, Astro +
# Starlight), stage.
#
# TLS is terminated UPSTREAM (the edge in front of every site on this VM),
# so this vhost listens on :80 only.
#
# Static files only: deploy/website/stage.sh builds the site into
#   /home/digital/sites/stage.memento-service.org/releases/<short sha>/
# and atomically repoints the `current` symlink this root follows.
# /_astro/* is content-hashed and cached for a year; everything else
# (HTML, pagefind's index, the sitemap) is revalidated on every request.
# A path that does not exist is a real 404 with the site's 404 page.
#
# The bare name only: *.stage.memento-service.org is the old mementoservice
# app (nginx-stage.memento-service.org.conf), and examples. / service. have
# exact vhosts of their own (memento-stage, memento-service-stage). The old
# vhost must not list stage.memento-service.org itself (docs/DEPLOYMENT.md,
# "The website").
#
# Install (deploy/website/stage.sh --install does this, from the checkout it deploys):
#   sudo ln -sfn /home/digital/sites/stage.memento-service.org/src/deploy/website/nginx/stage.memento-service.org.conf \
#       /etc/nginx/sites-enabled/stage.memento-service.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/website/stage.sh
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name stage.memento-service.org;

    access_log /var/log/nginx/stage.memento-service.access.log;
    error_log  /var/log/nginx/stage.memento-service.error.log;

    root  /home/digital/sites/stage.memento-service.org/current;
    index index.html;

    # /get-started -> /get-started/ as a relative Location: the edge speaks
    # https, this vhost does not know it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed by Astro: a changed file gets a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
